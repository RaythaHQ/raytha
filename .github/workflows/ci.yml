name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check VERSION
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e origin/${{ github.base_ref }}:VERSION 2>/dev/null; then
            python3 tools/check-version.py --before origin/${{ github.base_ref }} --after HEAD
          else
            echo "No VERSION on base branch yet; skipping"
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a770a91b5d3795c9072f4db61925592 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Raytha.sln
      - run: dotnet build Raytha.sln --no-restore --configuration Release
      - run: dotnet test Raytha.sln --no-build --configuration Release

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/admin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7602656ece021f84 # v4.3.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck && pnpm build
      - name: Committed admin bundle is fresh
        working-directory: .
        run: git diff --exit-code -- src/Raytha.Web/wwwroot/raytha

  image:
    runs-on: ubuntu-latest
    needs: [backend, admin]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: docker build -t raytha:ci .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: raytha:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
