name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    # labeled/unlabeled re-run the version check when version-override is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check VERSION
        if: github.event_name == 'pull_request'
        env:
          # Break glass: a maintainer labels the PR version-override to accept a VERSION the
          # bump rules would reject (RFC-0012 section 2). The label is visible on the PR.
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'version-override') && '--override' || '' }}
        run: |
          python3 tools/check-version.py --self-test
          if git cat-file -e origin/${{ github.base_ref }}:VERSION 2>/dev/null; then
            python3 tools/check-version.py --before origin/${{ github.base_ref }} --after HEAD $OVERRIDE
          else
            echo "No VERSION on base branch yet; skipping"
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Raytha.sln
      - run: dotnet build Raytha.sln --no-restore --configuration Release
      - run: dotnet test Raytha.sln --no-build --configuration Release
      - name: db/Postgres scripts match the migrations
        run: |
          dotnet tool restore --tool-manifest src/Raytha.Web/.config/dotnet-tools.json
          python3 tools/check-sql-scripts.py --configuration Release --no-build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/admin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck && pnpm build
      - name: Committed admin bundle is fresh
        working-directory: .
        run: git diff --exit-code -- src/Raytha.Web/wwwroot/raytha

  image:
    runs-on: ubuntu-latest
    needs: [backend, admin]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: docker build -t raytha:ci .
      - name: Trivy vulnerability scan
        # v0.36.0+ after the 2026 trivy-action compromise. Pin the scanner too: Aqua deleted
        # release assets for scanner v0.27.0-v0.69.1, and v0.29.0 of the action pulled an
        # unresolvable setup-trivy. Avoid scanner v0.69.4.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: raytha:ci
          version: v0.72.0
          severity: CRITICAL,HIGH
          exit-code: "1"
